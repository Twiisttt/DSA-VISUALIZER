<h1>Sorting Visualizer</h1>

<button onclick="generateArray()">Generate Array</button>

<select id="algoSelect">
  <option value="bubble">Bubble Sort</option>
  <option value="selection">Selection Sort</option>
  <option value="merge">Merge Sort</option>
</select>

<button onclick="startSort()">Sort</button>

<p id="sortCounter">Comparisons: 0</p>
<p id="sortComplexity"></p>

<div id="sortContainer"></div>

<h2>Practice Questions</h2>

<div id="questionBox">
  <p id="questionText"></p>

  <button onclick="checkAnswer(0)"></button>
  <button onclick="checkAnswer(1)"></button>
  <button onclick="checkAnswer(2)"></button>

  <p id="quizResult"></p>
</div>

<h3>Call Stack</h3>
<div id="callStack"></div>

<script type="module" src="js/sorting.js"></script>
<script src="js/ui.js"></script>
<script src="js/quiz.js"></script>
<script src="js/theme.js"></script>

</body>
