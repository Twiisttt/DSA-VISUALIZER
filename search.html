<body>

<h1>Search Visualizer</h1>


<input id="searchInput" type="text" placeholder="Enter target">

<button onclick="generateSearchArray()">Generate Array</button>

<select id="searchAlgo">
  <option value="linear">Linear Search</option>
  <option value="binary">Binary Search</option>
</select>

<button onclick="startSearch()">Search</button>

<p id="searchCounter">Comparisons: 0</p>
<p id="searchResult"></p>

<div id="searchContainer"></div>

<h2>Practice Questions</h2>

<div id="questionBox">
  <p id="questionText"></p>

  <button onclick="checkAnswer(0)"></button>
  <button onclick="checkAnswer(1)"></button>
  <button onclick="checkAnswer(2)"></button>

  <p id="quizResult"></p>
</div>

<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/quiz.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/firebase.js"></script>

</body>


</html>
